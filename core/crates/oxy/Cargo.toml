[package]
name = "oxy"
description = "Oxy CLI: query the core without a frontend, run extension cases, inspect the registry."
# `cargo run -p oxy` means the CLI — the crate also ships the oxy-agent
# daemon binary, which is never what a bare `cargo run` wants.
default-run = "oxy"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
oxy-core = { path = "../oxy-core" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
interprocess.workspace = true
fancy-regex.workspace = true

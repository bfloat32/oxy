[workspace]
resolver = "2"
members = ["crates/oxy-core", "crates/oxyd", "crates/oxy"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# 1.88 stabilized let-chains on edition 2024, which the engine and natives use;
# 1.89 stabilized `File::try_lock`, which the state layer locks MRU files with.
rust-version = "1.89"
license = "MIT"
description = "The Rust core of Oxy: query routing, extension runtime, ranking and state."

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
# preserve_order: a settings file that comes in ordered goes out ordered —
# `oxy save` must not alphabetise the user's oxy.json.
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "io-util", "io-std", "fs", "signal", "net"] }
interprocess = { version = "2", features = ["tokio"] }
fancy-regex = "0.14"
sysinfo = "0.33"
ignore = "0.4"
# The first dep past the seven-crate baseline, and only for `tz`: IANA zones
# and DST math at arbitrary instants cannot be a table — `sao paulo` must
# resolve. jiff reads the system zoneinfo on Linux and bundles tzdb on
# Windows; chrono-tz was the other candidate and is winding down.
jiff = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
# Line tables keep perf/flamegraph output attributable; full debuginfo is
# stripped from shipped binaries.
debug = "line-tables-only"
strip = "debuginfo"

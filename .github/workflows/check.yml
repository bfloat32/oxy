name: check

on:
  push:
    branches: [main, experimental/rust-core]
  pull_request:

jobs:
  # CI runs the same suite a push is held to locally — tests/run.sh is the
  # contract, so the guards (case shape, file budget, model/ layering, view
  # sync, manifest + native legs, fmt, QML balance) cannot drift out of sync
  # with a second copy here.
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: install check dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck fd-find jq git curl bsdextrautils qalc
          # the scripts call `fd`; Debian names the binary fdfind
          sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd
          # clippy ships with the toolchain; rustfmt is a separate component
          rustup component add rustfmt clippy

      - name: run.sh
        run: bash tests/run.sh
